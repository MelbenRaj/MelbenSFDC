
name: Salesforce CI/CD

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-salesforce:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the GitHub repository code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Install Salesforce CLI
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      # Step 3: Authenticate with Salesforce Developer Org
      - name: Authenticate Salesforce
        env:
          SF_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          printf '%s' "$SF_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --set-default

      # Step 4: Validate Salesforce metadata deployment
      - name: Validate Salesforce deployment
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org DevOrg \
            --dry-run \
            --test-level NoTestRun \
            --wait 30
